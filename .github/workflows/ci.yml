name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - elixir: '1.18'
            otp: '27'
            lint: false
          - elixir: '1.19'
            otp: '28'
            lint: false
          - elixir: '1.20'
            otp: '29'
            lint: true
    env:
      MIX_ENV: test
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
      - run: mix local.hex --force
      - run: mix local.rebar --force
      - run: mix deps.get
      - if: matrix.lint
        run: mix format --check-formatted
      - if: matrix.lint
        run: mix compile --warnings-as-errors
      - run: mix test --cover
